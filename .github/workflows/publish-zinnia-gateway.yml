name: Publish Zinnia gateway

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-zinnia-gateway.yml
      - cmd/agent/**
      - cmd/gateway/**
      - docker/Dockerfile.gateway
      - go.mod
      - go.sum
      - pkg/**
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-zinnia-gateway-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish gateway
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.gateway
          target: release
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/bodyiq/beta9/gateway:sha-${{ github.sha }}
            ghcr.io/bodyiq/beta9/gateway:main
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
